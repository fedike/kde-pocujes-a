<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kde počuješ A?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
    color: #1e3a5f;
    background: linear-gradient(155deg, #e9f6ee 0%, #eef3fb 55%, #e6eff9 100%);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  .app {
    height: 100dvh;
    padding: 1.4vh 2.2vw 1.8vh;
    display: flex;
    flex-direction: column;
    gap: 0.8vh;
  }
  header h1 {
    margin: 0;
    text-align: center;
    font-size: 5.6vh;
    letter-spacing: 0.02em;
  }
  header .hint {
    margin: 0.4vh 0 0;
    text-align: center;
    font-size: 2.8vh;
    color: #33506e;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: min(66vw, 112vh);
    margin: 0.6vh auto 0;
    font-weight: 700;
    font-size: 2.7vh;
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .img-panel {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: min(66vw, 112vh);
    background: #ffffff;
    border: 0.6vh solid #f5b940;
    border-radius: 2.6vh;
    box-shadow: 0 1vh 3vh rgba(30, 58, 95, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .img-panel .art {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-panel .art svg {
    width: 100%;
    height: 100%;
  }
  .smiley {
    position: absolute;
    top: 0.6vh;
    right: 0.8vh;
    width: 8vh;
    height: 8vh;
    pointer-events: none;
    display: none;
  }
  .smiley svg { width: 100%; height: 100%; }
  .word-area {
    flex: 0 0 auto;
    height: 14vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .word {
    font-size: 8.5vh;
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1;
  }
  .word .hl-wrong { color: #e53935; font-style: italic; }
  .word .hl-ok { color: #2e9e4f; font-style: italic; }
  .buttons {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    gap: 3vw;
    height: 14.5vh;
  }
  .buttons button {
    flex: 0 1 26vw;
    max-width: 34vh;
    font-family: inherit;
    font-size: 4.6vh;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #1e3a5f;
    background: #ffffff;
    border: 0.55vh solid #1e3a5f;
    border-radius: 2vh;
    box-shadow: 0 0.9vh 0 #1e3a5f, 0 1.6vh 2vh rgba(30, 58, 95, 0.18);
    cursor: pointer;
    transition: transform 0.05s linear, box-shadow 0.05s linear;
  }
  .buttons button:active:not(:disabled) {
    transform: translateY(0.6vh);
    box-shadow: 0 0.3vh 0 #1e3a5f;
  }
  .buttons button:focus-visible { outline: 0.5vh solid #f5b940; outline-offset: 0.4vh; }
  .buttons button:disabled { opacity: 0.55; cursor: default; }
  @media (orientation: portrait) {
    header h1 { font-size: 4.6vh; }
    header .hint { font-size: 2.3vh; }
    .word-area { height: 11vh; }
    .word { font-size: 7vh; }
    .buttons { height: 12vh; gap: 2vw; }
    .buttons button { font-size: 3.6vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Kde počuješ A?</h1>
    <p class="hint">Pozri sa na obrázok a vyber správne miesto.</p>
  </header>
  <div class="meta">
    <span id="series">Séria 1</span>
    <span id="counter">1 / 30</span>
  </div>
  <main class="stage">
    <div class="img-panel">
      <div class="art" id="art"></div>
      <div class="smiley" id="smiley"></div>
    </div>
    <div class="word-area"><div class="word" id="word"></div></div>
  </main>
  <div class="buttons">
    <button id="btn-start" type="button">ZAČIATOK</button>
    <button id="btn-mid" type="button">STRED</button>
    <button id="btn-end" type="button">KONIEC</button>
  </div>
</div>

// slovo, kategória (start/mid/end)
const WORDS = [
  ["AUTO", "start"], ["AUTOBUS", "start"], ["ANJEL", "start"], ["ANTÉNA", "start"], ["AGENT", "start"],
  ["AKVÁRIUM", "start"], ["ALIGÁTOR", "start"], ["AVOKÁDO", "start"], ["ALBUM", "start"], ["AKORDEÓN", "start"],
  ["VLAK", "mid"], ["HAD", "mid"], ["RAK", "mid"], ["MAK", "mid"], ["DAR", "mid"],
  ["HRAD", "mid"], ["MRAK", "mid"], ["PARK", "mid"], ["TANK", "mid"], ["TRAKTOR", "mid"],
  ["SOVA", "end"], ["RYBA", "end"], ["KNIHA", "end"], ["NOHA", "end"], ["RUKA", "end"],
  ["MUCHA", "end"], ["GUMA", "end"], ["LUPA", "end"], ["ZIMA", "end"], ["KOZA", "end"]
];

const CAT_OF = { start: "btn-start", mid: "btn-mid", end: "btn-end" };

function highlightIndexes(word, cat) {
  if (cat === "start") return [0];
  if (cat === "end") return [word.length - 1];
  return [word.indexOf("A")];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeSeries(forbiddenFirst) {
  let s;
  do {
    s = shuffle(WORDS);
  } while (s.length > 1 && s[0][0] === forbiddenFirst);
  return s;
}

const elSeries = document.getElementById("series");
const elCounter = document.getElementById("counter");
const elArt = document.getElementById("art");
const elSmiley = document.getElementById("smiley");
const elWord = document.getElementById("word");
const buttons = {
  start: document.getElementById("btn-start"),
  mid: document.getElementById("btn-mid"),
  end: document.getElementById("btn-end")
};

let series = makeSeries(null);
let pos = 0;          // poradie v sérii (0-based)
let serieNo = 1;
let locked = false;
let timerId = null;

function setButtonsEnabled(on) {
  for (const k in buttons) buttons[k].disabled = !on;
}

function renderWord(entry, cls) {
  const word = entry[0];
  const hl = highlightIndexes(word, entry[1]);
  let html = "";
  for (let i = 0; i < word.length; i++) {
    if (hl.indexOf(i) >= 0) {
      html += '<span class="' + cls + '">' + word[i] + "</span>";
    } else {
      html += word[i];
    }
  }
  elWord.innerHTML = html;
}

function showTask() {
  const entry = series[pos];
  elArt.innerHTML = ART[entry[0]];
  elWord.innerHTML = "";
  elSmiley.style.display = "none";
  elSeries.textContent = "Séria " + serieNo;
  elCounter.textContent = (pos + 1) + " / " + series.length;
  locked = false;
  setButtonsEnabled(true);
}

function answer(cat) {
  if (locked) return;
  const entry = series[pos];
  if (cat === entry[1]) {
    locked = true;
    setButtonsEnabled(false);
    renderWord(entry, "hl-ok");
    elSmiley.innerHTML = SMILE_HAPPY;
    elSmiley.style.display = "block";
    timerId = setTimeout(nextTask, 4000);
  } else {
    renderWord(entry, "hl-wrong");
    elSmiley.innerHTML = SMILE_SAD;
    elSmiley.style.display = "block";
  }
}

function nextTask() {
  pos++;
  if (pos >= series.length) {
    const lastWord = series[series.length - 1][0];
    serieNo++;
    series = makeSeries(lastWord);
    pos = 0;
  }
  showTask();
}

buttons.start.addEventListener("click", function () { answer("start"); });
buttons.mid.addEventListener("click", function () { answer("mid"); });
buttons.end.addEventListener("click", function () { answer("end"); });

showTask();
